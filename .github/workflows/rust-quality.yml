name: Rust Code Quality

on:
  workflow_call:
    inputs:
      clippy-flags:
        description: "Extra flags passed to cargo clippy (after --)"
        required: false
        type: string
        default: "-W clippy::pedantic -W clippy::nursery -W clippy::cargo"
      upload-coverage:
        description: "Upload coverage report to Codecov"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Run markdownlint
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  rust-quality:
    name: Rust Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Run clippy
        env:
          CLIPPY_FLAGS: ${{ inputs.clippy-flags }}
        run: cargo clippy --all-targets --all-features -- $CLIPPY_FLAGS
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Check for TODO/FIXME comments
        run: |
          TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX\|HACK" src/ --exclude-dir=target \
            | grep -v "// Check for TODO" | grep -v '"TODO"' | grep -v "todo_count" \
            | wc -l)
          if [ "$TODO_COUNT" -gt 0 ]; then
            echo "Found $TODO_COUNT TODO/FIXME comments:"
            grep -r "TODO\|FIXME\|XXX\|HACK" src/ --exclude-dir=target \
              | grep -v "// Check for TODO" | grep -v '"TODO"' | grep -v "todo_count"
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: inputs.upload-coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v6
        with:
          files: lcov.info
          fail_ci_if_error: false
