name: Test orchestrator guards

# Runs the regression tests for claude-maintenance-orchestrator.yml's
# "Verify credentials" and "Verify repo coverage" steps on the same runner
# image the orchestrator uses (ubuntu-latest). The tests read each step's
# script straight from the workflow; curl and gh are stubbed, so no secrets
# are needed.

on:
  pull_request:
    paths:
      - .github/workflows/claude-maintenance-orchestrator.yml
      - .github/workflows/test-orchestrator.yml
      - .github/tests/orchestrator-guards/**
  push:
    branches: [main]
    paths:
      - .github/workflows/claude-maintenance-orchestrator.yml
      - .github/workflows/test-orchestrator.yml
      - .github/tests/orchestrator-guards/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestrator-guards:
    name: Orchestrator guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run guard tests
        run: .github/tests/orchestrator-guards/run.sh
